services:
  # ---- Backend: FastAPI, as a Docker web service -------------------------
  - type: web
    name: smartvote-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_ADMIN_PASSWORD
        sync: false          # set this yourself in the Render dashboard — don't commit a real password
      # Optional — auto-create the other role logins too, without touching
      # the UI. Leave any of these unset in the Render dashboard to skip it;
      # nothing breaks either way. See .env.render.example for details.
      - key: SEED_VOTER_MANAGER_PASSWORD
        sync: false
      - key: SEED_VOTE_TRACKER_PASSWORD
        sync: false
      - key: SEED_ELECTION_OFFICER_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://smartvote-frontend.onrender.com   # update after the frontend gets its real URL
      - key: COOKIE_SECURE
        value: "true"        # Render serves everything over HTTPS by default
      - key: COOKIE_SAMESITE
        value: "none"        # frontend and backend are different *.onrender.com domains
      - key: ADMIN_SESSION_HOURS
        value: "8"
      - key: DATABASE_URL
        value: sqlite:////data/smartvote.db
    disk:
      name: smartvote-data
      mountPath: /data
      sizeGB: 1
    # NOTE: persistent disks and "always on" (no spin-down) require a paid
    # Render plan. On the free plan the service sleeps when idle and this
    # disk section will be ignored — meaning your SQLite data will NOT
    # persist. Fine for testing the deploy; upgrade the plan before a real
    # election. See README.md "Deploying on Render" for the Postgres
    # alternative, which survives on the free plan.

  # ---- Frontend: Vite build, as a static site -----------------------------
  - type: web
    name: smartvote-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://smartvote-backend.onrender.com   # update after the backend gets its real URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
